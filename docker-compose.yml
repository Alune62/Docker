services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=db
      - DB_USER=user_blog
      - DB_PASSWORD=motdepasse
      - DB_NAME=blog
    depends_on:
      - db

  db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=rootpass
      - MYSQL_DATABASE=blog
      - MYSQL_USER=user_blog
      - MYSQL_PASSWORD=motdepasse
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: